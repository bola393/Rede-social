# ═══════════════════════════════════════════════════════════════════════════
#  coturn — o plano B das chamadas
#
#  Quando dois celulares conseguem se enxergar direto, o áudio e o vídeo vão de
#  um para o outro sem passar por lugar nenhum. Quando não conseguem (operadora
#  com NAT restrito é o caso mais comum), este servidor repassa os pacotes.
#
#  Ele **não** consegue ouvir nem ver nada: o WebRTC cifra a mídia
#  ponta-a-ponta com DTLS-SRTP antes de entregá-la, então o que atravessa aqui
#  é ruído. O coturn é um carteiro, não um leitor.
#
#  Com o Tailscale ligado, os aparelhos quase sempre se acham direto e este
#  servidor nem entra na jogada. Ele existe para o dia em que não acharem, e
#  para quando a rede for para a VPS.
# ═══════════════════════════════════════════════════════════════════════════

listening-port=3478
tls-listening-port=5349

# ─── Autenticação ──────────────────────────────────────────────────────────
# Nada de usuário e senha fixos: o servidor gera credenciais que valem poucas
# horas, assinadas com um segredo. Se uma vazar, ela já expirou.
#
# O segredo e o domínio NÃO ficam neste arquivo — o coturn não expande
# variáveis aqui, e deixá-los escritos significaria versionar segredo no Git.
# Eles chegam por linha de comando, a partir do `.env`, no docker-compose:
#
#     --static-auth-secret=... --realm=...
use-auth-secret

# ─── Faixa de portas para a mídia ──────────────────────────────────────────
# Precisa bater com o que o docker-compose publica.
min-port=49160
max-port=49200

# ─── Proteções ─────────────────────────────────────────────────────────────
# Sem isto, um servidor TURN aberto vira ferramenta de ataque contra terceiros:
# alguém o usaria para refletir tráfego em endereços internos ou alheios.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Uma chamada de vídeo em boa qualidade não passa nem perto disso. O teto está
# aqui para que um erro (ou um abuso) não consuma a internet da casa inteira.
user-quota=12
total-quota=1200
max-bps=2000000

# Sem CLI de administração aberta.
no-cli

# Menos ruído no log. Suba para 'verbose' só quando estiver investigando uma
# chamada que não conecta.
simple-log
no-stdout-log
log-file=stdout

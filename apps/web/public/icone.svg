<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nossa Rede">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f2a" />
      <stop offset="1" stop-color="#0f1115" />
    </linearGradient>
    <linearGradient id="laco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b8a" />
      <stop offset="1" stop-color="#7c8cff" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fundo)" />

  <!--
    Dois círculos entrelaçados: duas pessoas, e o espaço só delas no meio.
    Traço aberto de propósito — é um laço, não uma corrente.
  -->
  <g fill="none" stroke="url(#laco)" stroke-width="30" stroke-linecap="round">
    <circle cx="196" cy="256" r="96" />
    <circle cx="316" cy="256" r="96" />
  </g>

  <!-- O cadeado: o que acontece ali no meio fica ali. -->
  <g transform="translate(256 250)">
    <path
      d="M-22 -6 v-16 a22 22 0 0 1 44 0 v16"
      fill="none"
      stroke="#e6e8ee"
      stroke-width="13"
      stroke-linecap="round"
    />
    <rect x="-31" y="-6" width="62" height="50" rx="13" fill="#e6e8ee" />
  </g>
</svg>
